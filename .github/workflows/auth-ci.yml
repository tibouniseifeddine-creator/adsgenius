name: Auth CI

on:
  push:
    branches: [main, fix/real-auth-main]
  pull_request:
    branches: [main]

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Backend install and build
        working-directory: backend
        run: |
          npm install
          npx prisma generate
          npm run typecheck
          npm run build
