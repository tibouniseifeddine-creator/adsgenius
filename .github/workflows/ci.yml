name: AdsGenius CI

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adsgenius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adsgenius"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adsgenius
      API_REQUIRE_DATABASE: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Health smoke test
        run: |
          npm run start:backend > /tmp/adsgenius-api.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/adsgenius-api.log
          exit 1
